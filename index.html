<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only · © 2026 asergom · ver LICENSE y TERMINOS-ADICIONALES.md -->
<html lang="es" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vigo Bus</title>
  <meta name="description" content="Paradas de Vitrasa en Vigo y cuándo llega el próximo bus.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Vigo Bus">
  <meta property="og:title" content="Vigo Bus">
  <meta property="og:description" content="El bus donde realmente está, no donde debería estar">
  <meta property="og:image" content="https://proximovitrasa.github.io/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logo de Vigo Bus">
  <meta property="og:url" content="https://proximovitrasa.github.io/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#13222C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Vigo Bus">
  <link rel="preload" href="fonts/BarlowCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Barlow-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" data-i18n-aria="map"></div>


  <!-- Instalar la web como app: arriba del todo, sobre el mapa; solo en el móvil y si aún no se usa como app -->
  <div id="install" class="install" hidden>
    <button id="install-btn" class="install-btn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>
      <span data-i18n="install_app"></span>
    </button>
    <button id="install-close" class="install-close" type="button" data-i18n-aria="install_hide" data-i18n-title="install_hide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>

  <!-- iPhone: no se puede instalar desde la web; se explica cómo hacerlo con Safari -->
  <div id="ios-install" class="ios-install" hidden role="dialog" aria-modal="true" aria-labelledby="ios-install-title">
    <div class="ios-card">
      <h2 id="ios-install-title" data-i18n="ios_title"></h2>
      <ol class="steps-ios">
        <li><span data-i18n="ios_step1"></span>
          <svg class="ios-share" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4M7 11H5.5v9.5h13V11H17"/></svg></li>
        <li data-i18n="ios_step2"></li>
        <li data-i18n="ios_step3"></li>
      </ol>
      <!-- Firefox en Android: no permite que la web abra la instalación; se hace desde su menú -->
      <ol class="steps-ff" hidden>
        <li><span data-i18n="ff_step1"></span>
          <svg class="ios-share" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></li>
        <li data-i18n="ff_step2"></li>
        <li data-i18n="ff_step3"></li>
      </ol>
      <button id="ios-install-ok" class="ios-ok" type="button" data-i18n="ios_ok"></button>
    </div>
  </div>

  <!-- Acerca de (Más): qué es la web -->
  <div id="about-dialog" class="ios-install" hidden role="dialog" aria-modal="true" aria-labelledby="about-title">
    <div class="ios-card about-card">
      <button id="about-ok" class="about-x" type="button" data-i18n-aria="close" data-i18n-title="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <h2 id="about-title" data-i18n="about_title"></h2>
      <p data-i18n="about_p1"></p>
      <p data-i18n="about_p2"></p>
      <p data-i18n="about_p3"></p>
    </div>
  </div>

  <aside id="panel" class="panel" data-state="peek" data-i18n-aria="panel">
    <button id="grip" class="grip" type="button" data-i18n-aria="grip"><span></span></button>

    <!-- Cabecera roja de las pantallas propias (Favoritas, Líneas): rediseño, fase 1 -->
    <header id="screen-head" class="screen-head" hidden><h2 id="screen-title"></h2></header>
    <!-- Sobre la cabecera roja: casa y trabajo (Favoritas) o el buscador de líneas (Líneas) -->
    <div id="screen-extra" class="screen-extra" hidden></div>

    <div class="search-row">
      <div class="search">
        <label class="visually-hidden" for="q" data-i18n="search_label"></label>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
               data-i18n-ph="search_ph">
        <!-- Borrar lo escrito (buscador en uso, mockup 11) -->
        <button id="q-clear" class="q-clear" type="button" data-i18n-aria="clear" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <button id="q-cancel" class="q-cancel" type="button" data-i18n="cancel"></button>
      <!-- Cómo llegar: de un punto a otro -->
      <button id="go-trip" class="trip-btn" type="button" data-i18n-aria="trip_open">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 21.2 12 12 21.2 2.8 12z"/><path d="M9.5 14.5v-2.2a1.6 1.6 0 0 1 1.6-1.6h4.4M13.6 8.4l2.3 2.3-2.3 2.3"/></svg>
        <span data-i18n="trip_btn"></span>
      </button>
    </div>

    <!-- Lista: resultados de búsqueda, cerca de mí o favoritas -->
    <section id="home" class="view">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-near" aria-selected="true" type="button" data-i18n="tab_near"></button>
        <button role="tab" id="tab-fav" aria-selected="false" type="button" data-i18n="tab_fav"></button>
        <button role="tab" id="tab-lines" aria-selected="false" type="button" data-i18n="tab_lines"></button>
      </div>
      <p id="list-note" class="note"></p>
      <ul id="list" class="stops"></ul>
    </section>

    <!-- Línea: recorrido iluminado en el mapa y paradas en orden -->
    <section id="line" class="view" hidden>
      <div class="stop-head">
        <button id="line-back" class="icon-btn" type="button" data-i18n-aria="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="stop-title line-title">
          <span id="line-badge" class="badge"></span>
          <div class="line-name-wrap">
            <h2 id="line-name"></h2>
            <!-- Horarios de la línea (35): en la parada desde la que se abrió o, si no, desde su cabecera -->
            <button id="line-sched" class="sched-pill" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span data-i18n="sched_btn"></span></button>
          </div>
        </div>
        <div class="head-actions">
        <button class="icon-btn share" type="button" data-share="line" data-i18n-aria="share" data-i18n-title="share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>
        </button>
        </div>
      </div>
      <div id="line-dirs" class="tabs dirs" role="tablist" data-i18n-aria="direction"></div>
      <!-- Con una variante (un letrero) a la vista: volver a la línea completa -->
      <button id="line-whole" class="line-whole" type="button" data-i18n="whole_line" hidden></button>
      <!-- Próximo bus hacia la parada desde la que se abrió la línea -->
      <button id="line-bus" class="bus-card" type="button" data-i18n-aria="bus_see" hidden></button>
      <ol id="line-stops" class="stops route-list"></ol>
    </section>

    <!-- Cómo llegar: desde / hasta, en bus (con tiempos en vivo) o a pie -->
    <section id="trip" class="view" hidden>
      <div class="stop-head trip-head">
        <button id="trip-back" class="icon-btn" type="button" data-i18n-aria="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 class="trip-title" data-i18n="trip_title"></h2>
        <button class="icon-btn share" type="button" data-share="trip" data-i18n-aria="share" data-i18n-title="share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>
        </button>
      </div>
      <div class="trip-fields">
        <div class="trip-field">
          <span class="pin pin-a" aria-hidden="true">A</span>
          <label class="visually-hidden" for="trip-a" data-i18n="from"></label>
          <input id="trip-a" type="text" autocomplete="off" spellcheck="false" data-end="a" data-i18n-ph="from_ph">
          <button class="clear" type="button" data-clear="a" data-i18n-aria="clear" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="trip-field">
          <span class="pin pin-b" aria-hidden="true">B</span>
          <label class="visually-hidden" for="trip-b" data-i18n="to"></label>
          <input id="trip-b" type="text" autocomplete="off" spellcheck="false" data-end="b" data-i18n-ph="to_ph">
          <button class="clear" type="button" data-clear="b" data-i18n-aria="clear" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <button id="trip-swap" class="icon-btn swap" type="button" data-i18n-aria="swap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4v16M4.5 7.5 8 4l3.5 3.5M16 20V4M12.5 16.5 16 20l3.5-3.5"/></svg>
        </button>
      </div>
      <!-- Hora de salida: ahora o más tarde -->
      <div class="trip-when" role="group" data-i18n-aria="leave_label">
        <button id="when-now" type="button" aria-pressed="true" data-i18n="leave_now"></button>
        <!-- "Salir a las / Llegar a las" y la hora, con el aspecto de la web; debajo de cada texto,
             el control del navegador (invisible) que abre su selector al tocarlo -->
        <div class="when-pick">
          <span class="when-mode">
            <span id="when-mode-text" aria-hidden="true"></span><svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
            <select id="when-mode" data-i18n-aria="when_mode">
              <option value="dep" data-i18n="leave_at"></option>
              <option value="arr" data-i18n="arrive_by"></option>
            </select>
          </span>
          <span class="when-time">
            <svg class="clock" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span id="when-text" aria-hidden="true"></span>
            <input id="when-at" type="datetime-local" step="60" data-i18n-aria="when_time">
          </span>
        </div>
      </div>
      <!-- Preferencia de ruta: más rápido, menos transbordos o menos a pie -->
      <div id="trip-pref" class="trip-pref" role="radiogroup" data-i18n-aria="pref_label">
        <button type="button" role="radio" data-pref="fast" data-i18n="pref_fast"></button>
        <button type="button" role="radio" data-pref="transfers" data-i18n="pref_transfers"></button>
        <button type="button" role="radio" data-pref="walk" data-i18n="pref_walk"></button>
      </div>
      <ul id="trip-sugg" class="stops trip-sugg" hidden></ul>
      <div id="trip-result" class="trip-result" aria-live="polite"></div>
    </section>

    <!-- Dirección (calle y número) elegida en el buscador o tocando un número en el mapa -->
    <section id="place" class="view" hidden>
      <div class="stop-head">
        <button id="place-back" class="icon-btn" type="button" data-i18n-aria="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="stop-title">
          <h2 id="place-name"></h2>
          <p class="stop-meta"><span id="place-meta"></span><span id="place-dist"></span></p>
        </div>
        <div class="head-actions">
        <button class="icon-btn share" type="button" data-share="place" data-i18n-aria="share" data-i18n-title="share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>
        </button>
        <button id="place-fav" class="icon-btn fav" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></svg>
        </button>
        </div>
      </div>
      <button id="place-trip" class="place-trip" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 21.2 12 12 21.2 2.8 12z"/><path d="M9.5 14.5v-2.2a1.6 1.6 0 0 1 1.6-1.6h4.4M13.6 8.4l2.3 2.3-2.3 2.3"/></svg>
        <span data-i18n="trip_here"></span>
      </button>
      <p class="group-label" data-i18n="near_stops"></p>
      <ul id="place-stops" class="stops"></ul>
    </section>

    <!-- Horarios de una parada: los publicados por Vitrasa, por tipo de día -->
    <section id="sched" class="view" hidden>
      <div class="stop-head">
        <button id="sched-back" class="icon-btn" type="button" data-i18n-aria="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="stop-title">
          <h2 id="sched-name"></h2>
          <p class="stop-meta" id="sched-meta"></p>
        </div>
        <button class="icon-btn share" type="button" data-share="sched" data-i18n-aria="share" data-i18n-title="share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>
        </button>
      </div>
      <div id="sched-days" class="tabs" role="tablist">
        <button role="tab" type="button" data-day="w" data-i18n="day_week"></button>
        <button role="tab" type="button" data-day="6" data-i18n="day_sat"></button>
        <button role="tab" type="button" data-day="0" data-i18n="day_sun"></button>
      </div>
      <div id="sched-list" class="sched-list" aria-live="polite"></div>
    </section>

    <!-- Información útil: solo enlaces a las páginas oficiales de Vitrasa -->
    <section id="info" class="view" hidden>
      <div class="stop-head">
        <button id="info-back" class="icon-btn" type="button" data-i18n-aria="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="stop-title">
          <h2 data-i18n="info_title"></h2>
          <p class="stop-meta" data-i18n="info_note"></p>
        </div>
      </div>
      <!-- Más (rediseño): idioma e instalar la app en dos tarjetas -->
      <div class="more-tools">
        <div class="lang">
          <button id="lang-btn" class="more-tile" type="button" aria-haspopup="listbox" aria-expanded="false" data-i18n-aria="language">
            <span class="hw-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg></span>
            <span class="hw-txt"><b data-i18n="language"></b><small id="lang-code"></small></span>
            <svg class="flag" viewBox="0 0 30 20" aria-hidden="true" hidden></svg>
          </button>
          <ul id="lang-menu" class="lang-menu" role="listbox" hidden data-i18n-aria="language"></ul>
        </div>
        <button id="more-install" class="more-tile" type="button" hidden>
          <span class="hw-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M12 7v7M9 11l3 3 3-3"/></svg></span>
          <span class="hw-txt"><b data-i18n="more_install"></b><small data-i18n="more_install_sub"></small></span>
        </button>
        <button id="more-about" class="more-tile" type="button">
          <span class="hw-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg></span>
          <span class="hw-txt"><b data-i18n="about_tile"></b><small data-i18n="about_tile_sub"></small></span>
        </button>
      </div>
      <ul id="info-list" class="stops info-list"></ul>
    </section>

    <!-- Ficha de parada -->
    <section id="stop" class="view" hidden>
      <div class="stop-head">
        <button id="back" class="icon-btn" type="button" data-i18n-aria="back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="stop-title">
          <h2 id="stop-name"></h2>
          <p class="stop-meta"><span id="stop-id"></span><span id="stop-dist"></span></p>
        </div>
        <div class="head-actions">
        <button id="sched-open" class="icon-btn" type="button" data-i18n-aria="sched_btn" data-i18n-title="sched_btn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
        <button class="icon-btn share" type="button" data-share="stop" data-i18n-aria="share" data-i18n-title="share">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5.5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="18.5" r="2.5"/><path d="M8.2 10.8l7.6-4.1M8.2 13.2l7.6 4.1"/></svg>
        </button>
        <button id="fav" class="icon-btn fav" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></svg>
        </button>
        </div>
      </div>

      <div id="arrivals" class="arrivals" aria-live="polite"></div>

      <!-- Debajo de las llegadas (al bajar): actualización, líneas que paran y más opciones -->
      <footer class="stop-foot">
        <p class="upd"><span id="updated"></span><button id="refresh" type="button" data-i18n="refresh"></button></p>
        <p class="sec-head" data-i18n="lines_here"></p>
        <p id="stop-lines" class="lines" data-i18n-aria="lines_here"></p>
        <div class="foot-btns">
          <button id="trip-here" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l10 10-10 10L2 12z"/><path d="M9 13v-2h5M12 8.5l2.5 2.5-2.5 2.5"/></svg><span data-i18n="trip_here"></span></button>
          <a id="infobus" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span data-i18n="infobus"></span></a>
        </div>
      </footer>
    </section>
  </aside>
  <!-- Barra de secciones: abajo en el móvil, a la izquierda en el ordenador (rediseño, fase 1) -->
  <nav id="tabbar" class="tabbar" data-i18n-aria="nav_label">
    <a href="#" data-go="" data-i18n-title="nav_search"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></span><span class="lbl" data-i18n="nav_search"></span></a>
    <a href="#favoritas" data-go="favoritas" data-i18n-title="tab_fav"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/></svg></span><span class="lbl" data-i18n="tab_fav"></span></a>
    <a href="#ir" data-go="ir" data-i18n-title="trip_btn"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8 21.2 12 12 21.2 2.8 12z"/><path d="M9.5 14.5v-2.2a1.6 1.6 0 0 1 1.6-1.6h4.4M13.6 8.4l2.3 2.3-2.3 2.3"/></svg></span><span class="lbl" data-i18n="trip_btn"></span></a>
    <a href="#lineas" data-go="lineas" data-i18n-title="tab_lines"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="15" rx="3"/><path d="M5 11h14M8 21v-3M16 21v-3"/></svg></span><span class="lbl" data-i18n="tab_lines"></span></a>
    <a href="#info" data-go="info" data-i18n-title="nav_more"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/></svg></span><span class="lbl" data-i18n="nav_more"></span></a>
  </nav>
