# Registro temporal de la API de tiempos en vivo (tarea 75: ramales y letreros, p. ej. la C3i).
# Consulta en bucle las paradas de tools/registro-paradas.json (tronco de cada línea y paradas
# justo después de cada separación de ramales) y guarda las respuestas, junto con el GTFS del día,
# en la rama prueba-concello (registro/<día>/). No toca main ni la web ni abre avisos.
# TEMPORAL: borrar este archivo (y tools/registrar_api.py, elegir_paradas_registro.js y
# registro-paradas.json si ya no hacen falta) después del domingo 15/11/2026.
name: Registrar la API de Vitrasa (temporal)
on:
  schedule:
    # Horas en UTC (en noviembre, igual que Lisboa; en Vigo, +1 h). Fechas fijas: cada fecha
    # solo vuelve a repetirse dentro de un año, y el archivo se borrará antes.
    - cron: "41 5 9 11 *"     # lunes 9/11, mañana (después del Action semanal de horarios)
    - cron: "23 11 9 11 *"    # lunes 9/11, mediodía y tarde
    - cron: "59 16 9 11 *"    # lunes 9/11, tarde y noche
    - cron: "41 10 15 11 *"   # domingo 15/11, alrededor de las 12:57 (caso de la C3i)
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos de registro"
        default: "330"
permissions:
  contents: write   # solo para guardar el registro en la rama prueba-concello
concurrency:
  group: registrar-api
  cancel-in-progress: false   # si se solapan, la siguiente espera a que acabe la anterior
jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Guardar el GTFS del día (para comparar con el horario de esta semana)
        run: |
          mkdir -p registro
          curl -sS --fail --retry 3 --retry-delay 10 -m 120 -o registro/gtfs_vigo.zip https://datos.vigo.org/data/transporte/gtfs_vigo.zip || echo "no se pudo bajar el GTFS" > registro/gtfs.error
          git rev-parse HEAD > registro/commit.txt
          cp tools/registro-paradas.json registro/

      - name: Registrar la API
        run: python3 tools/registrar_api.py registro/api.jsonl "${{ github.event.inputs.minutos || '330' }}"

      - name: Resumen
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          n = err = 0; lin = collections.Counter(); letreros = set()
          for l in open("registro/api.jsonl", encoding="utf-8"):
              r = json.loads(l); n += 1
              if "error" in r: err += 1; continue
              for x in r["est"]: lin[x["linea"]] += 1; letreros.add((x["linea"], x["ruta"]))
          print(f"**{n} consultas**, {err} con error; {len(lin)} líneas y {len(letreros)} letreros distintos vistos.")
          EOF

      # A la rama prueba-concello (no a main): los artefactos no se pueden descargar desde la sesión
      # de Claude, git sí. El GTFS solo se guarda una vez por versión (nombre con su md5).
      - name: Guardar el registro en la rama prueba-concello
        if: always()
        run: |
          set -e
          dia=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin prueba-concello
          git worktree add /tmp/rama FETCH_HEAD
          mkdir -p "/tmp/rama/registro/$dia"
          gzip -9 -c registro/api.jsonl > "/tmp/rama/registro/$dia/api-${GITHUB_RUN_ID}.jsonl.gz"
          cp registro/commit.txt "/tmp/rama/registro/$dia/commit-${GITHUB_RUN_ID}.txt"
          if [ -f registro/gtfs_vigo.zip ]; then
            md5=$(md5sum registro/gtfs_vigo.zip | cut -c1-12)
            [ -f "/tmp/rama/registro/gtfs-$md5.zip" ] || cp registro/gtfs_vigo.zip "/tmp/rama/registro/gtfs-$md5.zip"
            echo "gtfs-$md5.zip" > "/tmp/rama/registro/$dia/gtfs-${GITHUB_RUN_ID}.txt"
          fi
          cd /tmp/rama
          git add registro
          git commit -q -m "Registro de la API ${dia} (ejecución ${GITHUB_RUN_ID})"
          for i in 1 2 3; do
            git push origin HEAD:prueba-concello && exit 0
            git pull --rebase -q origin prueba-concello || true
          done
          exit 1
