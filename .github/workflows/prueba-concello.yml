# Temporal (rama prueba-concello): pide al planificador del Concello (OpenTripPlanner) unos
# trayectos de prueba y guarda las respuestas en fuentes/concello/. Solo para comparar.
name: Comparar con el planificador del Concello
on:
  push:
    branches: [prueba-concello]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pedir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pedir los trayectos
        run: |
          mkdir -p fuentes/concello
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, time
          for n, a, b, mode, date, hora in json.load(open("fuentes/casos-concello.json")):
              q = urllib.parse.urlencode({"fromPlace": a, "toPlace": b, "date": date, "time": hora, "mode": mode,
                                          "numItineraries": 3, "locale": "es"})
              url = "https://planificador-rutas.vigo.org/otp/routers/default/plan?" + q
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "proximovitrasa-pruebas"}), timeout=60)
                  body = r.read()
                  print(n, r.status, len(body))
              except Exception as e:
                  body = json.dumps({"error": str(e)}).encode()
                  print(n, "ERROR", e)
              open(f"fuentes/concello/{n}.json", "wb").write(body)
              time.sleep(2)
          PY
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes
          git commit -m "Respuestas del planificador del Concello" || true
          git push origin HEAD:${GITHUB_REF_NAME}
